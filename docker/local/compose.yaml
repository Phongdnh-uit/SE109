services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306'

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port
